<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1290 762"
     width="1290" height="762">
  <!--
    Day 3 BG Drawing Template — v2: ACTUAL LAYOUT (May 30, 2026)
    Shows character TOPS and BOTTOMS based on real auto-layout positions
    + scales currently used in Day 3.

    Computed from PotionShopLayoutConfig defaults:
      autoLayoutStartX = 0.45, autoLayoutEndX = 0.82
      autoLayoutYActive = 0.48, autoLayoutYWaiting = 0.48
      autoLayoutScaleActive = 1.0
      autoLayoutScaleWaiting1 = 0.85
      autoLayoutScaleWaiting2 = 0.75
      Ednar X = 0.13, Y = 0.55, scale = 1.0
      Character source = 76 (portraitDiameter) * 2 (baseScale) = 152x228 logical
        → on 1290×762 canvas = 456x684 px
  -->

  <rect x="0" y="0" width="1290" height="762" fill="#ffffff"/>
  <rect x="0" y="0" width="1290" height="762" fill="none" stroke="#000" stroke-width="2"/>

  <!-- 100-px reference grid -->
  <g stroke="#dddddd" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="762"/>
    <line x1="200" y1="0" x2="200" y2="762"/>
    <line x1="300" y1="0" x2="300" y2="762"/>
    <line x1="400" y1="0" x2="400" y2="762"/>
    <line x1="500" y1="0" x2="500" y2="762"/>
    <line x1="600" y1="0" x2="600" y2="762"/>
    <line x1="700" y1="0" x2="700" y2="762"/>
    <line x1="800" y1="0" x2="800" y2="762"/>
    <line x1="900" y1="0" x2="900" y2="762"/>
    <line x1="1000" y1="0" x2="1000" y2="762"/>
    <line x1="1100" y1="0" x2="1100" y2="762"/>
    <line x1="1200" y1="0" x2="1200" y2="762"/>
    <line x1="0" y1="100" x2="1290" y2="100"/>
    <line x1="0" y1="200" x2="1290" y2="200"/>
    <line x1="0" y1="300" x2="1290" y2="300"/>
    <line x1="0" y1="400" x2="1290" y2="400"/>
    <line x1="0" y1="500" x2="1290" y2="500"/>
    <line x1="0" y1="600" x2="1290" y2="600"/>
    <line x1="0" y1="700" x2="1290" y2="700"/>
  </g>

  <!-- =====  EDNAR  =====
       Center: (168, 419)  size 456x684  scale 1.0
       Note: extends OFF-CANVAS at left edge by ~60 px (visible: x = 0 to 396) -->
  <rect x="-60" y="77" width="456" height="684" fill="#5b9bd5" fill-opacity="0.35"
        stroke="#1f4e79" stroke-width="3"/>
  <text x="168" y="380" font-family="Helvetica, Arial, sans-serif" font-size="32"
        font-weight="bold" fill="#1f4e79" text-anchor="middle">EDNAR</text>
  <text x="168" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14"
        fill="#1f4e79" text-anchor="middle">scale 1.0 · 456 × 684</text>
  <text x="168" y="430" font-family="Helvetica, Arial, sans-serif" font-size="11"
        fill="#1f4e79" text-anchor="middle">extends off-canvas left ←</text>

  <!-- TOP of Ednar -->
  <line x1="-60" y1="77" x2="396" y2="77" stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="404" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f4e79">Ednar TOP · y=77</text>

  <!-- BOTTOM of Ednar (touches floor at y=761) -->
  <line x1="-60" y1="761" x2="396" y2="761" stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="404" y="757" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f4e79">Ednar BOTTOM · y=761 (at canvas edge)</text>


  <!-- =====  ACTIVE customer (queue[0])  =====
       Center: (580, 366)  size 456x684  scale 1.0  -->
  <rect x="352" y="24" width="456" height="684" fill="#ed7d31" fill-opacity="0.30"
        stroke="#c00000" stroke-width="3"/>
  <text x="580" y="340" font-family="Helvetica, Arial, sans-serif" font-size="30"
        font-weight="bold" fill="#7f2704" text-anchor="middle">ACTIVE</text>
  <text x="580" y="370" font-family="Helvetica, Arial, sans-serif" font-size="14"
        fill="#7f2704" text-anchor="middle">queue[0] · scale 1.0</text>
  <text x="580" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13"
        fill="#7f2704" text-anchor="middle">456 × 684 · center (580, 366)</text>

  <!-- TOP / BOTTOM lines for active -->
  <line x1="352" y1="24" x2="808" y2="24" stroke="#c00000" stroke-width="1.5"/>
  <text x="816" y="29" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c00000">ACTIVE top · y=24</text>

  <line x1="352" y1="708" x2="808" y2="708" stroke="#c00000" stroke-width="1.5"/>
  <text x="816" y="704" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c00000">ACTIVE feet · y=708</text>


  <!-- =====  WAITER 1 (queue[1])  =====
       Position X varies with width mix; representative center ~819 (for medium mix)
       Center: (819, 366)  size 388x581  scale 0.85  -->
  <rect x="625" y="76" width="388" height="581" fill="#70ad47" fill-opacity="0.25"
        stroke="#548235" stroke-width="3"/>
  <text x="819" y="340" font-family="Helvetica, Arial, sans-serif" font-size="26"
        font-weight="bold" fill="#385723" text-anchor="middle">WAITER 1</text>
  <text x="819" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13"
        fill="#385723" text-anchor="middle">queue[1] · scale 0.85</text>
  <text x="819" y="383" font-family="Helvetica, Arial, sans-serif" font-size="12"
        fill="#385723" text-anchor="middle">388 × 581 · center varies</text>
  <text x="819" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11"
        fill="#385723" text-anchor="middle">(typically x ≈ 700–940)</text>

  <line x1="625" y1="76" x2="1013" y2="76" stroke="#548235" stroke-width="1.5"/>
  <text x="1021" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#548235">WAITER 1 top · y=76</text>

  <line x1="625" y1="656" x2="1013" y2="656" stroke="#548235" stroke-width="1.5"/>
  <text x="1021" y="652" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#548235">WAITER 1 feet · y=656</text>


  <!-- =====  WAITER 2 (queue[2])  =====
       Center: (1058, 366)  size 342x513  scale 0.75  -->
  <rect x="887" y="110" width="342" height="513" fill="#7030a0" fill-opacity="0.22"
        stroke="#5b1a89" stroke-width="3"/>
  <text x="1058" y="340" font-family="Helvetica, Arial, sans-serif" font-size="24"
        font-weight="bold" fill="#3b0764" text-anchor="middle">WAITER 2</text>
  <text x="1058" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12"
        fill="#3b0764" text-anchor="middle">queue[2] · scale 0.75</text>
  <text x="1058" y="383" font-family="Helvetica, Arial, sans-serif" font-size="12"
        fill="#3b0764" text-anchor="middle">342 × 513 · center (1058, 366)</text>

  <line x1="887" y1="110" x2="1229" y2="110" stroke="#5b1a89" stroke-width="1.5"/>
  <text x="887" y="105" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5b1a89" text-anchor="end">WAITER 2 top · y=110</text>

  <line x1="887" y1="622" x2="1229" y2="622" stroke="#5b1a89" stroke-width="1.5"/>
  <text x="887" y="618" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5b1a89" text-anchor="end">WAITER 2 feet · y=622</text>


  <!-- ===== Feet "floor band" =====
       Active feet=708, Waiter1 feet=656, Waiter2 feet=622
       → Floor area spans y=622 to y=708 (86 px range)
       Draw a floor in the BG that accommodates all three feet positions. -->
  <rect x="0" y="622" width="1290" height="86" fill="#ffcccc" fill-opacity="0.25"
        stroke="#aa0000" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="20" y="668" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#aa0000">
    FLOOR BAND y=622 to 708 — character feet land somewhere in this range
  </text>


  <!-- ===== ALWAYS-VISIBLE zones ===== -->
  <!-- Top safe zone: above ACTIVE's top (y=0 to 24) -->
  <rect x="0" y="0" width="1290" height="24" fill="#fff59d" fill-opacity="0.5"/>
  <text x="645" y="17" font-family="Helvetica, Arial, sans-serif" font-size="11"
        font-weight="bold" fill="#5b5400" text-anchor="middle">
    FULLY-VISIBLE TOP STRIP (y=0 to 24) — sky / ceiling / signs
  </text>

  <!-- Bottom safe zone: below ACTIVE's feet (y=708 to 762) -->
  <rect x="0" y="708" width="1290" height="54" fill="#fff59d" fill-opacity="0.5"/>
  <text x="645" y="745" font-family="Helvetica, Arial, sans-serif" font-size="13"
        font-weight="bold" fill="#5b5400" text-anchor="middle">
    FULLY-VISIBLE BOTTOM (y=708 to 762) — front floor / foreground props
  </text>


  <!-- ===== Center markers ===== -->
  <line x1="645" y1="0" x2="645" y2="762" stroke="#aaa" stroke-width="0.5" stroke-dasharray="2 4"/>
  <line x1="0" y1="381" x2="1290" y2="381" stroke="#aaa" stroke-width="0.5" stroke-dasharray="2 4"/>


  <!-- ===== Header label ===== -->
  <rect x="0" y="0" width="370" height="22" fill="#000" fill-opacity="0.75"/>
  <text x="8" y="15" font-family="Courier, monospace" font-size="11" fill="#ffffff">
    Day 3 BG · v2 · ACTUAL char tops/bottoms · 1290×762
  </text>

</svg>
